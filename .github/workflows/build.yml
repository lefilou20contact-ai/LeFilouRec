name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    # macOS est facultatif : son échec ne bloque pas le reste
    continue-on-error: ${{ matrix.name == 'macos' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Vérifier tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build Windows (FFmpeg inclus)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name LeFilouRec --collect-submodules pynput recorder.py
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName dist/LeFilouRec/ffmpeg.exe
          Compress-Archive -Path dist/LeFilouRec -DestinationPath LeFilouRec-windows.zip

      - name: Build Linux
        if: matrix.name == 'linux'
        run: |
          pyinstaller --noconfirm --name LeFilouRec --collect-submodules pynput recorder.py
          tar -czf LeFilouRec-linux.tar.gz -C dist LeFilouRec

      - name: Build macOS
        if: matrix.name == 'macos'
        run: |
          pyinstaller --noconfirm --windowed --name LeFilouRec --osx-bundle-identifier fr.lefilou.rec --collect-submodules pynput recorder.py
          ditto -c -k --keepParent dist/LeFilouRec.app LeFilouRec-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LeFilouRec-${{ matrix.name }}
          path: |
            LeFilouRec-windows.zip
            LeFilouRec-linux.tar.gz
            LeFilouRec-macos.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
