name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            label: Windows
          - os: ubuntu-22.04
            name: linux
            label: Linux
          - os: macos-latest
            name: macos
            label: macOS
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # macOS est facultatif : son échec ne bloque pas le reste
    continue-on-error: ${{ matrix.name == 'macos' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Vérifier tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Icône
        run: python make_icon.py

      # ---------------- Windows : installateur .exe (Inno Setup) ----------------
      - name: Build Windows (installateur)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          pyinstaller --noconfirm --windowed --name LeFilouRec --icon icon.ico --collect-submodules pynput recorder.py
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName dist/LeFilouRec/ffmpeg.exe
          choco install innosetup -y --no-progress
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" installer/windows.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ---------------- Linux : .deb + AppImage ----------------
      - name: Build Linux (.deb + AppImage)
        if: matrix.name == 'linux'
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0"; fi
          pyinstaller --noconfirm --onefile --name LeFilouRec --collect-submodules pynput recorder.py
          bash installer/linux.sh "$VER"

      # ---------------- macOS : .dmg ----------------
      - name: Build macOS (.dmg)
        if: matrix.name == 'macos'
        run: |
          pyinstaller --noconfirm --windowed --name LeFilouRec --osx-bundle-identifier fr.lefilou.rec --collect-submodules pynput recorder.py
          mkdir dmg
          cp -R dist/LeFilouRec.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "LeFilou Rec" -srcfolder dmg -ov -format UDZO LeFilouRec-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: LeFilouRec-${{ matrix.name }}
          path: |
            LeFilouRec-Setup-windows.exe
            LeFilouRec-linux-amd64.deb
            LeFilouRec-linux-x86_64.AppImage
            LeFilouRec-macos.dmg
          if-no-files-found: error

  android:
    name: Build Android
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LeFilouRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LeFilouRemote-android
          path: LeFilouRemote.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: LeFilou Rec ${{ github.ref_name }}
          files: artifacts/*
